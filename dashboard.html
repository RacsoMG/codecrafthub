<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeCraftHub Dashboard</title>
  <style>
    :root {
      --primary: #8B5CF6;
      --primary-dark: #7C3AED;
      --primary-soft: #EDE9FE;
      --success: #F59E0B;
      --success-dark: #D97706;
      --danger: #EF4444;
      --danger-dark: #DC2626;
      --text: #1F2937;
      --muted: #6B7280;
      --border: #E5E7EB;
      --bg: #F5F3FF;
      --card: #FFFFFF;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff;
      padding: 1.5rem 1rem;
      text-align: center;
      box-shadow: 0 2px 8px rgba(124, 58, 237, .3);
    }
    header h1 { font-size: 1.6rem; font-weight: 700; }
    header p { opacity: .9; font-size: .95rem; }
    main { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }

    .panel {
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .panel h2 { font-size: 1.2rem; margin-bottom: 1rem; color: var(--primary-dark); }

    /* ---------- form ---------- */
    .form-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 1rem; }
    .form-group { display: flex; flex-direction: column; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: .85rem; font-weight: 600; margin-bottom: .35rem; }
    label .req { color: var(--danger); }
    input, textarea, select {
      font: inherit;
      padding: .6rem .75rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: #fff;
      width: 100%;
    }
    textarea { min-height: 80px; resize: vertical; }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, .2);
    }
    .invalid { border-color: var(--danger) !important; }
    .field-error { color: var(--danger); font-size: .8rem; min-height: 1rem; margin-top: .2rem; }
    .form-actions { margin-top: 1rem; display: flex; gap: .5rem; justify-content: flex-end; }

    /* ---------- buttons ---------- */
    button {
      font: inherit; font-weight: 600;
      border: none; border-radius: 8px;
      padding: .55rem 1.1rem;
      cursor: pointer;
      display: inline-flex; align-items: center; gap: .4rem;
      transition: background .15s, transform .1s;
    }
    button:active { transform: scale(.97); }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-success:hover:not(:disabled) { background: var(--success-dark); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover:not(:disabled) { background: var(--danger-dark); }
    .btn-ghost { background: #F3F4F6; color: var(--text); }
    .btn-ghost:hover:not(:disabled) { background: #E5E7EB; }
    .btn-sm { padding: .4rem .8rem; font-size: .85rem; }

    /* ---------- stats + toolbar ---------- */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: .75rem; margin-bottom: 1rem; }
    .stat { background: var(--primary-soft); border-radius: 10px; padding: .75rem; text-align: center; }
    .stat b { display: block; font-size: 1.5rem; color: var(--primary-dark); }
    .stat span { font-size: .8rem; color: var(--muted); }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: .75rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .toolbar h2 { margin: 0; }
    .toolbar select { width: auto; }

    /* ---------- course cards ---------- */
    .courses { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
    .course {
      border: 1.5px solid var(--border);
      border-left: 5px solid var(--primary);
      border-radius: 10px;
      padding: 1rem;
      display: flex; flex-direction: column; gap: .5rem;
      background: #fff;
    }
    .course.completed { border-left-color: var(--success); }
    .course-top { display: flex; justify-content: space-between; align-items: flex-start; gap: .5rem; }
    .course h3 { font-size: 1.05rem; word-break: break-word; }
    .course .desc { color: #4B5563; font-size: .92rem; white-space: pre-wrap; word-break: break-word; }
    .course .meta { font-size: .8rem; color: var(--muted); border-top: 1px solid var(--border); padding-top: .5rem; }
    .course .meta .overdue { color: var(--danger); font-weight: 600; }
    .course .actions { display: flex; gap: .5rem; margin-top: auto; }
    .badge { font-size: .72rem; font-weight: 700; padding: .2rem .6rem; border-radius: 999px; white-space: nowrap; }
    .badge.not-started { background: #F3F4F6; color: #4B5563; }
    .badge.in-progress { background: var(--primary-soft); color: var(--primary-dark); }
    .badge.completed { background: #FEF3C7; color: #92400E; }
    .course-id { color: var(--muted); font-size: .75rem; font-weight: 400; }

    .empty, .loading-box { text-align: center; padding: 2.5rem 1rem; color: var(--muted); }

    /* ---------- spinner ---------- */
    .spinner {
      width: 18px; height: 18px;
      border: 3px solid rgba(255,255,255,.5);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      display: inline-block;
    }
    .spinner.big { width: 40px; height: 40px; border-color: var(--primary-soft); border-top-color: var(--primary); margin-bottom: .5rem; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- messages ---------- */
    #toasts { position: fixed; top: 1rem; right: 1rem; display: flex; flex-direction: column; gap: .5rem; z-index: 1000; max-width: calc(100% - 2rem); }
    .toast {
      padding: .75rem 1rem; border-radius: 8px; color: #fff; font-weight: 500;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
      animation: slide .25s ease-out;
      max-width: 380px;
    }
    .toast.success { background: var(--success-dark); }
    .toast.error { background: var(--danger); }
    @keyframes slide { from { transform: translateX(30px); opacity: 0; } }
    .banner { background: #FEE2E2; color: #991B1B; border: 1px solid var(--danger); border-radius: 8px; padding: .75rem 1rem; margin-bottom: 1rem; }

    /* ---------- modal ---------- */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(17, 24, 39, .55);
      display: none; align-items: center; justify-content: center; padding: 1rem; z-index: 900;
    }
    .modal-backdrop.open { display: flex; }
    .modal { background: #fff; border-radius: 12px; width: 100%; max-width: 560px; padding: 1.5rem; max-height: 90vh; overflow-y: auto; }
    .modal h2 { color: var(--primary-dark); margin-bottom: 1rem; font-size: 1.2rem; }
    .modal .form-grid { grid-template-columns: 1fr 1fr; }

    /* ---------- responsive ---------- */
    @media (max-width: 720px) {
      header h1 { font-size: 1.25rem; }
      .form-grid, .modal .form-grid { grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .courses { grid-template-columns: 1fr; }
      .form-actions button { flex: 1; justify-content: center; }
    }
  </style>
</head>
<body>
  <header>
    <h1>CodeCraftHub: Your Learning Management Platform</h1>
    <p>Track the courses you want to learn</p>
  </header>

  <main>
    <!-- ================= ADD COURSE ================= -->
    <section class="panel">
      <h2>Add a Course</h2>
      <form id="addForm" novalidate>
        <div class="form-grid">
          <div class="form-group">
            <label for="add-name">Course name <span class="req">*</span></label>
            <input id="add-name" name="name" type="text" placeholder="e.g. Python Basics" />
            <div class="field-error"></div>
          </div>
          <div class="form-group">
            <label for="add-target_date">Target date <span class="req">*</span></label>
            <input id="add-target_date" name="target_date" type="date" />
            <div class="field-error"></div>
          </div>
          <div class="form-group">
            <label for="add-status">Status <span class="req">*</span></label>
            <select id="add-status" name="status">
              <option>Not Started</option>
              <option>In Progress</option>
              <option>Completed</option>
            </select>
            <div class="field-error"></div>
          </div>
          <div class="form-group full">
            <label for="add-description">Description <span class="req">*</span></label>
            <textarea id="add-description" name="description" placeholder="What will you learn?"></textarea>
            <div class="field-error"></div>
          </div>
        </div>
        <div class="form-actions">
          <button type="reset" class="btn-ghost">Clear</button>
          <button type="submit" class="btn-primary" id="addBtn">Add Course</button>
        </div>
      </form>
    </section>

    <!-- ================= COURSE LIST ================= -->
    <section class="panel">
      <div class="stats" id="stats"></div>
      <div class="toolbar">
        <h2>My Courses</h2>
        <div>
          <select id="filter" aria-label="Filter by status">
            <option value="">All statuses</option>
            <option>Not Started</option>
            <option>In Progress</option>
            <option>Completed</option>
          </select>
          <button class="btn-ghost btn-sm" id="refreshBtn" title="Reload courses">Refresh</button>
        </div>
      </div>
      <div id="banner"></div>
      <div id="courses"></div>
    </section>
  </main>

  <!-- ================= EDIT MODAL ================= -->
  <div class="modal-backdrop" id="editModal" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <div class="modal">
      <h2 id="editTitle">Edit Course</h2>
      <form id="editForm" novalidate>
        <input type="hidden" name="id" />
        <div class="form-grid">
          <div class="form-group full">
            <label for="edit-name">Course name <span class="req">*</span></label>
            <input id="edit-name" name="name" type="text" />
            <div class="field-error"></div>
          </div>
          <div class="form-group">
            <label for="edit-target_date">Target date <span class="req">*</span></label>
            <input id="edit-target_date" name="target_date" type="date" />
            <div class="field-error"></div>
          </div>
          <div class="form-group">
            <label for="edit-status">Status <span class="req">*</span></label>
            <select id="edit-status" name="status">
              <option>Not Started</option>
              <option>In Progress</option>
              <option>Completed</option>
            </select>
            <div class="field-error"></div>
          </div>
          <div class="form-group full">
            <label for="edit-description">Description <span class="req">*</span></label>
            <textarea id="edit-description" name="description"></textarea>
            <div class="field-error"></div>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-ghost" id="cancelEdit">Cancel</button>
          <button type="submit" class="btn-success" id="saveBtn">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toasts" aria-live="polite"></div>

  <script>
    // =====================================================================
    // CONFIGURATION
    // =====================================================================
    // Works out where the Flask backend (port 5000) is, based on how this page
    // was opened:
    //  - served by Flask itself (http://localhost:5000/dashboard) -> same origin
    //  - Live Server on localhost (http://127.0.0.1:5500)          -> http://localhost:5000
    //  - Skills Network / cloud IDE proxy (https://user-5500.xxx)   -> https://user-5000.xxx
    //  - opened as a file (file://...)                              -> http://localhost:5000
    const BACKEND_PORT = '5000';
    function detectApiBase() {
      const { protocol, hostname, port } = window.location;
      if (protocol === 'file:') return `http://localhost:${BACKEND_PORT}/api/courses`;
      if (port === BACKEND_PORT) return '/api/courses';
      const proxied = hostname.match(/^(.*-)(\d{2,5})(\..+)$/);   // e.g. oscar-5500.proxy.example.com
      if (proxied) return `${protocol}//${proxied[1]}${BACKEND_PORT}${proxied[3]}/api/courses`;
      return `${protocol}//${hostname}:${BACKEND_PORT}/api/courses`;
    }
    const API_BASE_URL = detectApiBase();   // <- or hard-code: 'http://localhost:5000/api/courses'
    const STATUSES = ['Not Started', 'In Progress', 'Completed'];

    let courses = [];

    // =====================================================================
    // API HELPER: one place for fetch + error handling
    // =====================================================================
    async function api(path = '', options = {}) {
      let response;
      try {
        response = await fetch(API_BASE_URL + path, {
          headers: { 'Content-Type': 'application/json' },
          ...options,
        });
      } catch (networkError) {
        throw new Error(`Cannot reach the backend at ${API_BASE_URL}. Is the Flask server running?`);
      }
      let data = null;
      try { data = await response.json(); } catch (_) { /* empty or non-JSON body */ }
      if (!response.ok || (data && data.success === false)) {
        throw new Error((data && data.error) || `Request failed (HTTP ${response.status})`);
      }
      return data;
    }

    // =====================================================================
    // UI HELPERS
    // =====================================================================
    const $ = (sel) => document.querySelector(sel);

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    function toast(message, type = 'success') {
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = message;
      $('#toasts').appendChild(el);
      setTimeout(() => el.remove(), type === 'error' ? 6000 : 3500);
    }

    function setBusy(button, busy, label) {
      if (busy) {
        button.dataset.label = button.textContent;
        button.disabled = true;
        button.innerHTML = `<span class="spinner"></span> ${label}`;
      } else {
        button.disabled = false;
        button.textContent = button.dataset.label;
      }
    }

    // "2026-12-31" -> "Dec 31, 2026" (parsed as a local date, no timezone shift)
    function formatDate(ymd) {
      const [y, m, d] = String(ymd).split('-').map(Number);
      if (!y || !m || !d) return ymd;
      return new Date(y, m - 1, d).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }
    // "2026-10-26 10:30:00" -> "Oct 26, 2026, 10:30 AM"
    function formatDateTime(value) {
      if (!value) return '—';
      const dt = new Date(String(value).replace(' ', 'T'));
      return isNaN(dt) ? value : dt.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
    }
    function isOverdue(course) {
      const today = new Date().toISOString().slice(0, 10);
      return course.status !== 'Completed' && course.target_date < today;
    }

    // =====================================================================
    // VALIDATION
    // =====================================================================
    function readAndValidate(form) {
      const values = {
        name: form.name.value.trim(),
        description: form.description.value.trim(),
        target_date: form.target_date.value,
        status: form.status.value,
      };
      const errors = {};
      if (!values.name) errors.name = 'Course name is required';
      if (!values.description) errors.description = 'Description is required';
      if (!/^\d{4}-\d{2}-\d{2}$/.test(values.target_date)) errors.target_date = 'Pick a valid date';
      if (!STATUSES.includes(values.status)) errors.status = 'Choose a status';

      for (const field of ['name', 'description', 'target_date', 'status']) {
        const input = form[field];
        const msg = input.parentElement.querySelector('.field-error');
        input.classList.toggle('invalid', Boolean(errors[field]));
        if (msg) msg.textContent = errors[field] || '';
      }
      return Object.keys(errors).length ? null : values;
    }

    function clearErrors(form) {
      form.querySelectorAll('.invalid').forEach((el) => el.classList.remove('invalid'));
      form.querySelectorAll('.field-error').forEach((el) => (el.textContent = ''));
    }

    // =====================================================================
    // READ: load and render courses
    // =====================================================================
    async function loadCourses() {
      $('#banner').innerHTML = '';
      $('#courses').innerHTML = '<div class="loading-box"><div class="spinner big"></div><div>Loading courses…</div></div>';
      try {
        const data = await api();
        courses = Array.isArray(data) ? data : (data.courses || []);
        render();
      } catch (err) {
        courses = [];
        render();
        $('#banner').innerHTML = `<div class="banner"><strong>Could not load courses.</strong> ${escapeHtml(err.message)}</div>`;
      }
    }

    function render() {
      // stats
      const count = (s) => courses.filter((c) => c.status === s).length;
      $('#stats').innerHTML = [
        ['Total', courses.length],
        ['Not Started', count('Not Started')],
        ['In Progress', count('In Progress')],
        ['Completed', count('Completed')],
      ].map(([label, n]) => `<div class="stat"><b>${n}</b><span>${label}</span></div>`).join('');

      // list
      const filter = $('#filter').value;
      const visible = courses.filter((c) => !filter || c.status === filter);
      if (!visible.length) {
        $('#courses').innerHTML = `<div class="empty">${
          courses.length ? 'No courses with this status.' : 'No courses yet — add your first one above!'
        }</div>`;
        return;
      }
      $('#courses').innerHTML = `<div class="courses">${visible.map(courseCard).join('')}</div>`;
    }

    function courseCard(c) {
      const statusClass = String(c.status).toLowerCase().replace(/\s+/g, '-');
      return `
        <article class="course ${statusClass}">
          <div class="course-top">
            <h3>${escapeHtml(c.name)} <span class="course-id">#${escapeHtml(c.id)}</span></h3>
            <span class="badge ${statusClass}">${escapeHtml(c.status)}</span>
          </div>
          <p class="desc">${escapeHtml(c.description)}</p>
          <div class="meta">
            <div>Target: <span class="${isOverdue(c) ? 'overdue' : ''}">${escapeHtml(formatDate(c.target_date))}${isOverdue(c) ? ' (overdue)' : ''}</span></div>
            <div>Created: ${escapeHtml(formatDateTime(c.created_at))}</div>
          </div>
          <div class="actions">
            <button class="btn-success btn-sm" data-action="edit" data-id="${escapeHtml(c.id)}">Edit</button>
            <button class="btn-danger btn-sm" data-action="delete" data-id="${escapeHtml(c.id)}">Remove</button>
          </div>
        </article>`;
    }

    // =====================================================================
    // CREATE
    // =====================================================================
    $('#addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const values = readAndValidate(form);
      if (!values) { toast('Please fill in all required fields', 'error'); return; }

      const btn = $('#addBtn');
      setBusy(btn, true, 'Adding…');
      try {
        const data = await api('', { method: 'POST', body: JSON.stringify(values) });
        toast(`Added "${data.course ? data.course.name : values.name}"`);
        form.reset();
        clearErrors(form);
        await loadCourses();
      } catch (err) {
        toast(`Could not add course: ${err.message}`, 'error');
      } finally {
        setBusy(btn, false);
      }
    });
    $('#addForm').addEventListener('reset', (e) => clearErrors(e.target));

    // =====================================================================
    // UPDATE (modal)
    // =====================================================================
    const modal = $('#editModal');
    const editForm = $('#editForm');

    function openEdit(id) {
      // ids from data-attributes are strings; compare as strings so 1 == "1"
      const course = courses.find((c) => String(c.id) === String(id));
      if (!course) { toast('Course not found — try refreshing', 'error'); return; }
      clearErrors(editForm);
      editForm.id.value = course.id;
      editForm.name.value = course.name;
      editForm.description.value = course.description;
      editForm.target_date.value = course.target_date;
      editForm.status.value = course.status;
      modal.classList.add('open');
      editForm.name.focus();
    }
    function closeEdit() { modal.classList.remove('open'); }

    editForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const values = readAndValidate(editForm);
      if (!values) { toast('Please fill in all required fields', 'error'); return; }

      const btn = $('#saveBtn');
      setBusy(btn, true, 'Saving…');
      try {
        await api(`/${encodeURIComponent(editForm.id.value)}`, { method: 'PUT', body: JSON.stringify(values) });
        toast('Course updated');
        closeEdit();
        await loadCourses();
      } catch (err) {
        toast(`Could not update course: ${err.message}`, 'error');
      } finally {
        setBusy(btn, false);
      }
    });
    $('#cancelEdit').addEventListener('click', closeEdit);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeEdit(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeEdit(); });

    // =====================================================================
    // DELETE
    // =====================================================================
    async function removeCourse(id, button) {
      const course = courses.find((c) => String(c.id) === String(id));
      const name = course ? course.name : `#${id}`;
      if (!confirm(`Remove "${name}"? This cannot be undone.`)) return;

      setBusy(button, true, 'Removing…');
      try {
        await api(`/${encodeURIComponent(id)}`, { method: 'DELETE' });
        toast(`Removed "${name}"`);
        await loadCourses();
      } catch (err) {
        toast(`Could not remove course: ${err.message}`, 'error');
        setBusy(button, false);
      }
    }

    // One click handler for every Edit / Remove button (event delegation)
    $('#courses').addEventListener('click', (e) => {
      const button = e.target.closest('button[data-action]');
      if (!button) return;
      if (button.dataset.action === 'edit') openEdit(button.dataset.id);
      if (button.dataset.action === 'delete') removeCourse(button.dataset.id, button);
    });

    $('#filter').addEventListener('change', render);
    $('#refreshBtn').addEventListener('click', loadCourses);

    // Start
    loadCourses();
  </script>
</body>
</html>
